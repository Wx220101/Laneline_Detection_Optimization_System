[project]
name = "testintest"
version = "0.1.0"
description = "testintest using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.11.1"
]

[project.scripts]
testintest = "testintest.main:run"
run_crew = "testintest.main:run"
train = "testintest.main:train"
replay = "testintest.main:replay"
test = "testintest.main:test"
run_with_trigger = "testintest.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
