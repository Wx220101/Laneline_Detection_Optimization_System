analysis_task:
  description: >
    Analyze the provided lane detection system information: {system_info}
    Identify specific problems, limitations, performance bottlenecks, edge cases,
    and areas where the system fails or produces inaccurate results.
    Consider factors like: detection accuracy, processing speed, robustness to
    lighting conditions, handling of curves, occlusions, and real-world scenarios.
  expected_output: >
    A comprehensive analysis document containing:
    - Current system architecture and capabilities
    - Identified problems and failure modes
    - Performance bottlenecks
    - Critical edge cases and limitations
    - Impact assessment of each issue
    Formatted as markdown without '```'
  agent: lane_detection_analyst

improvement_task:
  description: >
    Based on the analysis from the lane detection analyst, propose concrete
    improvement solutions for the lane detection system.
    Design practical, implementable enhancements that address the identified issues.
    Consider: algorithm improvements, optimization techniques, hardware acceleration,
    data augmentation, model enhancements, and testing strategies.
  expected_output: >
    A detailed improvement proposal containing:
    - Prioritized list of improvements (with implementation difficulty and impact)
    - Specific algorithm or architecture enhancements
    - Code optimization recommendations
    - Testing and validation strategy
    - Expected performance gains
    - Implementation timeline and resource requirements
    Each suggestion should be actionable and include technical details.
    Formatted as markdown without '```'
  agent: improvement_engineer
  output_file: 'lane_detection_improvements.md'
