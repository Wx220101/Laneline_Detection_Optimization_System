perception_precision_task:
  description: >
    你是车道感知侧的唯一交付责任人。请围绕「车道线识别更加精准」这一目标，针对本仓库
    knowledge/智能车道线检测与保持_彭之芯_吴泓霖_柳阳_42035803/src/catkin_ws/src/lane_follower/scripts/
    中的参考实现进行分析与方案设计（若 repo_root_hint 非空，可与该路径拼接为绝对路径查阅源码）。

    务必结合下列已从知识库脚本归纳的实现要点（lane_detector 节点）：
    - 预处理：BGR→HSV，掩膜策略（历史上曾支持黄/白/黑多通道，当前逻辑以车道对比度为主）；ROI 高度与宽度比例参数。
    - 几何：Canny 双阈值；概率霍夫霍夫直线参数（阈值、最小线段长度、最大间隙）；左右车道线按斜率符号与位置筛选。
    - 偏移：双侧时用底部车道中心 vs 图像中心；单侧时用二次多项式拟合或启发式像素补偿。
    - 局限：直线段碎片化、光照变化、弯道仅用局部直线近似带来的抖动。
    - 代码事实核对：黄/白掩膜与合并逻辑在源码中曾被注释，当前有效路径主要使用黑色 HSV 掩膜；
      Canny 使用约 (50,150)；霍夫为 HoughLinesP，threshold=50、minLineLength=50、maxLineGap=50；
      斜率绝对值小于 0.5 的线段被丢弃；左右线通过斜率符号与 ROI 内位置筛选。

    输出必须包含：
    1) 当前管线的主要误差来源归纳（至少 3 条，需对应到处理阶段）。
    2) 优先推荐的改进措施清单（每条说明预期收益、实现代价、是否需要改相机标定或引入透视变换）。
    3) 建议的可调参数表（参数名、当前语义、建议搜索方向或范围思路，不要求编造具体硬件数值）。
    4) 离线/仿真验证建议（如何用录制 bag 或视频复现指标）。
    5) **分步实施手册（必备）**：对「阶段 A 内可完成的感知侧改动」至少列出 3 条，每条都必须固定使用下列小节编号格式，便于读者照着改：
       - **步骤 N — 标题**
       - **修改文件**：相对 knowledge 工程的路径（例如 `lane_follower/scripts/lane_detector.py`）。
       - **定位**：函数名/大致行号区间或搜索关键字（若无法确定行号则写清楚搜索片段）。
       - **改什么**：一句话说明变更意图。
       - **参考代码**：给出可直接粘贴或对照修改的 Python 片段（可用省略号 `...` 省略无关行）；若是参数调整则写出修改前后的对比示例。
       - **如何验证**：一条可执行的验证动作（例如运行节点、观察某一可视化或打印）。
       不要求覆盖全部算法重构；但必须让读者能按步骤动手而不是只看概念。

    仓库根路径提示（可为空字符串）：{repo_root_hint}

    项目代号：{project_name}
  expected_output: >
    一份结构化的 Markdown 报告，包含标题、分节与小标题；中文撰写；除分析与表格外，必须包含带编号的分步实施手册与小段参考代码，专业、可交给工程师直接排期的技术方案（不含空话）。
    本文档为感知侧**完整原文**，将作为集成文档附录引用来源；分步实施手册中的参考代码须写全、写清，勿过度压缩。
  agent: lane_perception_engineer
  markdown: true
  output_file: "{deliverable_dir}/01_perception.md"

control_response_task:
  description: >
    你是车辆控制侧的唯一交付责任人。请围绕「识别车道线后更快回到车道中央」这一目标，针对同一 knowledge 目录下
    lane_follower/scripts/pid_controller.py 参考实现进行分析与改进设计。

    务必结合下列已从知识库脚本归纳的实现要点：
    - 输入：LaneDetection 消息中的像素偏移 offset（及左右线是否检测到）。
    - 控制：比例/积分/微分系数 Kp、Ki、Kd；积分限幅；角速度饱和 max_steering；线速度随转向衰减。
    - 工程约束：publish_interval 对控制指令更新频率的限制；死区 deadzone；滑动平均 smooth_window 对平滑与滞后权衡。
    - 安全：长时间无检测时的 watchdog 停车逻辑。
    - 代码事实核对：lane_callback 开头存在 publish_interval（源码默认约 0.5s）节流，会导致控制指令更新频率远低于图像回调，
      这是「回中不够快」的首要嫌疑点之一；watchdog 约 0.5s 无消息则停车；camera_node 中 fps 参数默认较低亦可能影响闭环带宽。

    输出必须包含：
    1) 从感知输出到 cmd_vel 的延迟链条梳理，指出限制「快速回中」的首要瓶颈（需诚实基于代码结构推断）。
    2) 建议的 PID 与滤波参数调优顺序（先改哪几项、为什么）。
    3) 若需更快响应，给出与平滑/超调之间的折中策略（例如变增益、误差分区、或缩短平滑窗口的前提条件）。
    4) 建议的实车/仿真测试步骤与安全注意事项。
    5) **分步实施手册（必备）**：对「阶段 A 内可完成的控制侧改动」至少列出 3 条（例如减小节流间隔、调整 ROS 参数、微调 PID/死区/平滑窗口等），每条都必须使用与感知任务相同的小节结构：
       **步骤 N** / **修改文件** / **定位** / **改什么** / **参考代码**（含修改前后对比或完整替换片段）/ **如何验证**。
       至少有一条步骤必须直接针对 `publish_interval` 节流逻辑或 ros 参数覆盖方式给出可操作的改法。

    仓库根路径提示（可为空字符串）：{repo_root_hint}

    项目代号：{project_name}
  expected_output: >
    一份结构化的 Markdown 报告，章节清晰；中文撰写；除分析外必须包含带编号的分步实施手册与参考代码片段；以可落地调参与架构微调为主，避免脱离现有 ROS 话题结构的空想方案。
    本文档为控制侧**完整原文**，将作为集成文档附录引用来源；分步实施手册中的参考代码须写全、写清，勿过度压缩。
  agent: control_response_engineer
  markdown: true
  output_file: "{deliverable_dir}/02_control.md"

integration_task:
  description: >
    你是集成负责人。上游「感知」「控制」两份**完整报告**已由前序任务分别写入磁盘（与 `{deliverable_dir}/lane_improvement_plan.md` 同目录）：
    - `{deliverable_dir}/01_perception.md`（感知专题，含分步实施手册与代码）
    - `{deliverable_dir}/02_control.md`（控制专题，含分步实施手册与代码）
    本任务在上下文中仍可看到两份报告全文，但 **`lane_improvement_plan.md` 的定位是总览蓝图**：以合并思路为主，**不要**在正文里再次粘贴大段与专文件重复的 fenced 代码（避免冗余与截断）。

    你的任务是产出唯一一份对外交付文档，整合、去重并排序所有建议，形成统一的改进路线图。

    交付要求：
    1) 执行摘要（10 行以内）。
    2) 统一优先级矩阵：每条措施标注「影响感知精度 / 影响回中速度 / 实现难度 / 风险」。
    3) 分阶段计划：阶段 A（1–2 天可完成参数与频率类改动）、阶段 B（算法级改动）、阶段 C（硬件或大规模重构若需要则列出但不展开）。
    4) 感知与控制之间的接口约定检查清单（话题、消息字段语义、建议的控制频率与图像 FPS 匹配关系）。
    5) 验收 KPI 建议（例如：直线道偏移 RMSE、弯道最大横向误差、阶跃偏移后的稳定时间等——给出定义即可）。
    6) **总装「操作清单」**（正文）：将上游两份报告中的实施步骤去重、按依赖排序，合并为**单一编号列表**（步骤 1,2,3…）；
       每一步用简短条目写清「改什么、涉及文件、依赖、如何验证」，**每条不超过约 8 行**；需要展开代码处写「详见附录 A」或「详见附录 B」对应小节标题，**禁止**写「见某未给出路径的报告」等无法落地的指代。
    7) **附录（必备，放在 `lane_improvement_plan.md` 文末）**：
       - **附录 A — 感知专题全文**：先写一行说明「以下与 `{deliverable_dir}/01_perception.md` 内容一致」；然后**原样复制**你上下文中感知任务输出里**从第一个一级/二级标题起至文档结束的全部 Markdown**（含所有分步实施手册与 fenced 代码块，**不得删减、不得改写代码**）。若因长度无法一次贴全，则退而求其次：附录 A 仅保留相对链接 `[01_perception.md](01_perception.md)` 并紧跟一句「完整代码与步骤以专文件为准」——但**优先**原样附全文。
       - **附录 B — 控制专题全文**：同上，对应 `02_control.md` 与 `[02_control.md](02_control.md)`。

    写入目录提示：{deliverable_dir}
    项目代号：{project_name}
  expected_output: >
    完整的最终 Markdown 总览文档；中文；正文精炼、附录含感知/控制专文件全文或同目录相对链接；含合并后的操作清单（正文短、附录可长）。
  agent: optimization_integrator
  markdown: true
  output_file: "{deliverable_dir}/lane_improvement_plan.md"
